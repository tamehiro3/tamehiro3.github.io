<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ニンジャ夜明け隊 | 39人の忍者と夜明けをとりもどすRPG</title>
  <meta name="description" content="CryptoNinja の39人が仲間になる、コマンドでたたかうRPG。弱点を見つけて構えを崩し、印をためて大技。明けない夜を終わらせる旅へ。非公式ファンゲーム（試作版）。課金・ガチャ・スタミナなし。">
  <meta name="theme-color" content="#141a3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="夜明け隊">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="no-kbd">
  <canvas id="cv" aria-label="ゲームの画面"></canvas>

  <div id="ui">
    <!-- 地図を歩くとき -->
    <div id="hud" hidden>
      <div class="loc" id="loc"></div>
      <div class="obj" id="obj"></div>
      <button class="round" id="btn-menu" type="button" aria-label="メニュー">☰<small>M</small></button>
      <button class="round" id="btn-act" type="button">調べる<small>Enter</small></button>
      <div id="stick" hidden><i></i></div>
    </div>

    <!-- 戦い -->
    <div id="bt" hidden></div>

    <!-- 会話 -->
    <div id="dlg" class="win" hidden><div class="face"></div><div class="body"><span class="who"></span><p class="txt"></p></div><i class="more" hidden>▼</i></div>
    <div id="choice" class="win" hidden></div>

    <!-- 旅の地図 -->
    <div id="travel" hidden></div>

    <!-- メニュー・店 -->
    <div id="panel" hidden></div>

    <!-- 勝ち負け -->
    <div id="result" hidden></div>

    <!-- 見出し・仲間になった・かけら -->
    <div id="card" hidden></div>

    <!-- エンディング -->
    <div id="credits" hidden></div>

    <!-- タイトル -->
    <section id="title" hidden>
      <div class="tt-box">
        <p class="tt-kicker">CryptoNinja 非公式ファンゲーム・試作版</p>
        <h1 class="tt-name">ニンジャ<span>夜明け隊</span></h1>
        <p class="tt-sub">39人の忍者と、明けない夜を終わらせるRPG</p>
        <div class="tt-btns">
          <button class="btn gold" id="tt-continue" type="button" hidden>つづきから</button>
          <button class="btn" id="tt-new" type="button">はじめから</button>
          <button class="btn" id="tt-help" type="button">遊び方</button>
        </div>
        <p class="tt-note">コマンドでたたかうRPG・1〜数時間で最後まで遊べます<br>課金・ガチャ・スタミナなし／記録はこの端末に保存<br>
          <a href="about.html">遊び方・保護者の方へ</a>　<a href="../ninja-sato-life/sheets/">キャラクターシート（39体）</a>　<a href="/">しのびのゲーム工房</a></p>
      </div>
    </section>
    <section id="newgame" hidden></section>

    <div id="fade"></div>
    <div id="flash"></div>
    <div id="toast" aria-live="polite"></div>
  </div>
  <noscript><p style="color:#fff;padding:20px">このゲームは JavaScript を使います。</p></noscript>

  <script src="../ninja-sato-life/art.js?v=2"></script>
  <script src="../ninja-sato-life/chars.js?v=2"></script>
  <script src="data_base.js?v=3"></script>
  <script src="data_skills.js?v=3"></script>
  <script src="data_chars.js?v=3"></script>
  <script src="data_items.js?v=3"></script>
  <script src="data_enemies.js?v=3"></script>
  <script src="data_maps.js?v=3"></script>
  <script src="data_story.js?v=3"></script>
  <script src="state.js?v=3"></script>
  <script src="field.js?v=3"></script>
  <script src="script.js?v=3"></script>
  <script src="battle.js?v=3"></script>
  <script src="sprites.js?v=3"></script>
  <script src="draw_world.js?v=3"></script>
  <script src="draw_yokai.js?v=3"></script>
  <script src="render_field.js?v=3"></script>
  <script src="render_battle.js?v=3"></script>
  <script src="audio.js?v=3"></script>
  <script src="input.js?v=3"></script>
  <script src="ui.js?v=3"></script>
  <script src="ui_menu.js?v=3"></script>
  <script src="battle_ui.js?v=3"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
