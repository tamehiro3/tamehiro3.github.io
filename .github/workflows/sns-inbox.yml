# SNS 受付: Typelessで話した下書き（Issue「SNS下書き」）の機械検品と、承認→在庫投入
# - 開く/編集する → 機械検品の結果をコメント（外部SNSには何も送らない）
# - 所有者がラベル「承認」を付ける → 再検品してOKなら _marketing/sns/queue/ へコミットしてIssueを閉じる
# Issue本文は信頼できない入力なので、run: に式で埋め込まず、イベントJSONファイル経由で読む。
name: SNS 受付（下書きの検品・承認）

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-inbox-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  inbox:
    if: startsWith(github.event.issue.title, '[SNS]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # 画像つきの下書き（所有者が書いたものだけ）のときに文字認識（OCR）を入れる。本文は run: に埋め込まない
      - name: 文字認識（OCR）の準備
        if: >-
          github.event.issue.user.login == github.repository_owner &&
          (github.event.action != 'labeled' || github.event.label.name == '承認') &&
          (contains(github.event.issue.body, '/assets/') || contains(github.event.issue.body, 'githubusercontent.com'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn
      - name: 検品・承認
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _marketing/sns/tool/sns.py issue-event "$GITHUB_EVENT_PATH"
