<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>忍術の演出 見本（開発用）</title>
<style>
  :root { --washi: #f7f1e5; --ink: #3b2a20; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--washi); color: var(--ink); font-family: system-ui, sans-serif; font-size: 14px; }
  main { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  #stage { position: relative; width: 390px; height: 700px; border-radius: 10px; overflow: hidden; background: #11141f; flex: none; }
  #fx { width: 100%; height: 100%; display: block; }
  #skip { position: absolute; right: 10px; top: 10px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: rgba(255,255,255,.85); color: var(--ink); font-size: 15px; }
  #panel { flex: 1; min-width: 300px; max-width: 760px; }
  fieldset { border: 1px solid #d8ccb4; border-radius: 8px; margin: 0 0 10px; }
  label { margin-right: 10px; white-space: nowrap; }
  select, button { font-size: 14px; }
  #types { display: flex; flex-wrap: wrap; gap: 6px; }
  #types button { min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid #c9b896; background: #fffaf0; cursor: pointer; }
  #types button.on { background: #3b2a20; color: #fff; }
  #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; background: #fffaf0; border: 1px solid #e3d8c3; padding: 6px; }
  .sizes button { min-height: 32px; }
</style>
</head>
<body>
<main>
  <div id="stage"><canvas id="fx"></canvas><button id="skip" type="button">とばす</button></div>
  <div id="panel">
    <fieldset>
      <legend>設定</legend>
      <label>体 <select id="char"></select></label>
      <label>位（rank）<select id="rank"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>奥義（okugi）<select id="okugi"><option selected>0</option><option>1</option><option>2</option></select></label>
      <br>
      <label><input type="checkbox" id="secret"> ひみつの術（secret）</label>
      <label><input type="checkbox" id="kids" checked> こどもモード</label>
      <label><input type="checkbox" id="weapon"> 武器</label>
      <label><input type="checkbox" id="reduced"> 動きを減らす（試し）</label>
      <label><input type="checkbox" id="autoChar" checked> 術に合う体を選ぶ</label>
      <div class="sizes">画面: <button type="button" data-s="390x700">390×700</button> <button type="button" data-s="360x640">360×640</button> <button type="button" data-s="700x420">700×420</button></div>
    </fieldset>
    <fieldset>
      <legend>演出（押すと再生）</legend>
      <div id="types"></div>
      <p><button type="button" id="all">ぜんぶ続けて再生</button> <span id="status"></span></p>
    </fieldset>
    <div id="log"></div>
  </div>
</main>
<script src="../art.js?v=1"></script>
<script src="../chars.js?v=1"></script>
<script src="../data.js?v=1"></script>
<script src="../figure.js?v=1"></script>
<script src="../fx.js?v=1"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('fx'), cur = null, queue = [];
  var JF = SA.DATA.JUTSU_FX;
  window.__fxLog = [];
  function log(s) { $('log').textContent = s + '\n' + $('log').textContent; }

  NSL_CHARS.CHARS.forEach(function (c) { var o = document.createElement('option'); o.value = c.id; o.textContent = c.num + ' ' + c.name + '（' + JF[c.id] + '）'; $('char').appendChild(o); });
  SA.FX.TYPES.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.dataset.fx = t;
    b.onclick = function () { queue = []; play(t); };
    $('types').appendChild(b);
  });
  function charFor(t) {
    if (!$('autoChar').checked) return $('char').value;
    for (var id in JF) if (JF[id] === t) return id;
    return $('char').value;
  }
  function play(t, then) {
    if (cur) { var c = cur; cur = null; c.skip(); }
    var id = charFor(t);
    $('char').value = id;
    [].forEach.call($('types').children, function (b) { b.classList.toggle('on', b.dataset.fx === t); });
    var opts = {
      charId: id, fx: t, rank: +$('rank').value, okugi: +$('okugi').value, secret: $('secret').checked, kidsMode: $('kids').checked,
      weapon: $('weapon').checked,
      onDone: function (r) {
        window.__fxLog.push({ fx: t, charId: id, skipped: r.skipped, played: r.fx });
        log((r.skipped ? 'とばした ' : 'おわり ') + t + ' / ' + id + ' / rank ' + opts.rank + ' / okugi ' + opts.okugi);
        if (then) then();
      }
    };
    if ($('reduced').checked) opts.reducedMotion = true;
    $('status').textContent = t + ' を再生中';
    cur = SA.FX.play(canvas, opts);
    window.__fxCurrent = cur;
  }
  window.__playFx = play;
  $('skip').onclick = function () { if (cur) { var c = cur; cur = null; c.skip(); } };
  $('all').onclick = function () {
    queue = SA.FX.TYPES.slice();
    (function next() { var t = queue.shift(); if (!t) { $('status').textContent = 'ぜんぶおわり'; return; } play(t, next); })();
  };
  [].forEach.call(document.querySelectorAll('.sizes button'), function (b) {
    b.onclick = function () { var s = b.dataset.s.split('x'); $('stage').style.width = s[0] + 'px'; $('stage').style.height = s[1] + 'px'; };
  });
})();
</script>
</body>
</html>
