# SNS 受付: Typelessで話した下書き（Issue「SNS下書き」）の機械検品と、承認→在庫投入
# - 開く/編集する → 機械検品の結果をコメント（外部SNSには何も送らない）
# - 所有者がラベル「承認」を付ける → 再検品してOKなら _marketing/sns/queue/ へコミットしてIssueを閉じる
# Issue本文は信頼できない入力なので、run: に式で埋め込まず、イベントJSONファイル経由で読む。
name: SNS 受付（下書きの検品・承認）

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-inbox-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  inbox:
    if: startsWith(github.event.issue.title, '[SNS]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 検品・承認
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _marketing/sns/tool/sns.py issue-event "$GITHUB_EVENT_PATH"
